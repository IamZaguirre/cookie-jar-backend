spring.datasource.url=jdbc:postgresql://localhost:5432/cookie_jar
spring.datasource.username=dev
spring.datasource.password=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Load local secrets (gitignored) — create application-local.properties for local dev
spring.config.import=optional:classpath:application-local.properties

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Resend email API
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Admin email to receive new order notifications
app.admin-email=${ADMIN_EMAIL:}
